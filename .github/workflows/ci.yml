name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify immutable notebook baseline
        run: python scripts/check_notebook_baseline.py

      - name: Verify dependency direction
        run: python scripts/check_architecture.py

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src tests scripts

      - name: Test non-live suite with coverage
        run: >-
          python -m pytest -m "not live_api"
          --cov=codeframe
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      - name: Security scan
        run: python -m bandit -c pyproject.toml -r src app.py pages ui scripts

      - name: Dependency vulnerability audit
        run: python -m pip_audit

      - name: Build package
        run: python -m build

      - name: Validate installed import
        run: python -c "import codeframe; print(codeframe.__version__)"

      - name: Smoke-test Streamlit startup
        run: python scripts/smoke_streamlit.py
