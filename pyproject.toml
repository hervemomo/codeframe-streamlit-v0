[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeframe-streamlit"
version = "0.1.0"
description = "Modular Streamlit workflow for coding open-ended survey responses"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
dependencies = [
  "ftfy==6.3.1",
  "hdbscan==0.8.44",
  "lingua-language-detector==2.2.0",
  "matplotlib==3.11.1",
  "numpy==2.5.1",
  "openai==2.50.0",
  "openpyxl==3.1.5",
  "pandas==3.0.5",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "scikit-learn==1.9.0",
  "seaborn==0.13.2",
  "streamlit==1.60.0",
  "tenacity==9.1.4",
  "tqdm==4.70.0",
  "umap-learn==0.5.12",
  "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "build>=1.3,<2",
  "ipykernel==7.3.0",
  "mypy>=1.18,<2",
  "nbclient==0.11.0",
  "nbconvert==7.17.1",
  "pandas-stubs>=3.0,<4",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.3,<5",
  "pytest==9.1.1",
  "pytest-cov>=7,<8",
  "pytest-mock==3.15.1",
  "ruff>=0.12,<1",
  "setuptools>=77",
  "types-openpyxl>=3.1,<4",
  "types-seaborn>=0.13,<1",
  "wheel>=0.45,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["original_notebook.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["codeframe"]
exclude = ["original_notebook.ipynb"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "unit: deterministic isolated tests",
  "integration: tests crossing package boundaries",
  "parity: notebook parity and baseline checks",
  "e2e: mocked end-to-end workflow tests",
  "slow: tests intentionally excluded from fast local loops",
  "live_api: opt-in tests that may call external APIs",
]

[tool.coverage.run]
branch = true
source = ["codeframe"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = [".venv", "tests"]
